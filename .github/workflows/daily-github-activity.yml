name: Daily GitHub activity

on:
  schedule:
    - cron: "0 8 * * *"
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      date:
        description: Optional report date (YYYY-MM-DD); defaults to yesterday
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-github-activity
  cancel-in-progress: false

jobs:
  commit-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIVITY_USER: willwang2528
      ACTIVITY_TIMEZONE: Asia/Shanghai
      TARGET_REPOSITORY: willwang2528/profile
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select report date
        id: report
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          if [[ -n "$REQUESTED_DATE" ]]; then
            report_date="$REQUESTED_DATE"
          else
            report_date="$(TZ="$ACTIVITY_TIMEZONE" date --date=yesterday +%F)"
          fi
          if [[ ! "$report_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid report date: $report_date" >&2
            exit 2
          fi
          echo "date=$report_date" >> "$GITHUB_OUTPUT"

      - name: Generate report
        env:
          REPORT_DATE: ${{ steps.report.outputs.date }}
        run: |
          python3 -m unittest discover --start-directory .github/scripts --pattern "test_*.py"
          python3 .github/scripts/daily_github_activity.py --date "$REPORT_DATE"

      - name: Commit report to main
        env:
          REPORT_DATE: ${{ steps.report.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "tmp/$REPORT_DATE.txt"
          if git diff --cached --quiet; then
            echo "Report is already up to date."
            exit 0
          fi
          git commit -m "chore: add GitHub activity for $REPORT_DATE"
          git pull --rebase origin main
          git push origin HEAD:main
